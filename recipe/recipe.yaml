schema_version: 1

context:
  version: "0.52.0"

package:
  name: pydantic-ai-harness
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pydantic-ai-harness/pydantic_ai_harness-${{ version }}.tar.gz
  sha256: 321a8bdae70a34257ba22922e58b1e7d55aeef81b6165b0d79563c7746432e3f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - uv-dynamic-versioning >=0.7.0
    - pip
  run:
    - python >=${{ python_min }}
    - genai-prices >=0.0.71
    - httpx >=0.28.1
    - pydantic-ai-slim >=2.40.0

tests:
  - python:
      imports:
        - pydantic_ai_harness
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: The batteries for your Pydantic AI agent
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/pydantic/pydantic-ai-harness
  repository: https://github.com/pydantic/pydantic-ai-harness

extra:
  recipe-maintainers:
    - moritzwilksch
