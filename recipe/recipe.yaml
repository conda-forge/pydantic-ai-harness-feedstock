schema_version: 1

context:
  version: "0.12.0"

package:
  name: pydantic-ai-harness
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pydantic-ai-harness/pydantic_ai_harness-${{ version }}.tar.gz
  sha256: 67baf74c351706f4d017ca0f97b21ca90daba9461f25c20a1ba315acb9325bd5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - uv-dynamic-versioning >=0.7.0
    - pip
  run:
    - python >=${{ python_min }}
    - pydantic-ai-slim >=1.95.1

tests:
  - python:
      imports:
        - pydantic_ai_harness
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: The batteries for your Pydantic AI agent
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/pydantic/pydantic-ai-harness
  repository: https://github.com/pydantic/pydantic-ai-harness

extra:
  recipe-maintainers:
    - moritzwilksch
