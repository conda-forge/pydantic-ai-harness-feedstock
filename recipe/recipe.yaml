schema_version: 1

context:
  version: "0.55.0"
  # upstream pins pydantic-ai-slim to 2.<minor>.<patch> of this package
  slim_version: 2.${{ (version | split("."))[1] }}.${{ (version | split("."))[2] }}

package:
  name: pydantic-ai-harness
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pydantic-ai-harness/pydantic_ai_harness-${{ version }}.tar.gz
  sha256: f360d5b1aa0d285e304bc3f4fc6d816ed47fdbfc0b1e0dbf4c34cc87b6f6547a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - uv-dynamic-versioning >=0.7.0
    - pip
  run:
    - python >=${{ python_min }}
    - genai-prices >=0.0.71
    - httpx >=0.28.1
    - json-repair >=0.58.0
    - pydantic-ai-slim ==${{ slim_version }}

tests:
  - python:
      imports:
        - pydantic_ai_harness
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: The official capability library and harness for Pydantic AI
  license: MIT
  license_file: LICENSE
  homepage: https://pydantic.dev/docs/ai/harness/
  repository: https://github.com/pydantic/pydantic-ai

extra:
  recipe-maintainers:
    - moritzwilksch
